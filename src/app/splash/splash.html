<div class="splash-page">
  <!-- Dynamiczne, pływające cząsteczki i błyski w tle -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>
  <div class="bg-glow-orb orb-3"></div>

  <div class="splash-card">
    <!-- Wielka, Szalona Cyfra 40 z Błyskami -->
    <div class="hero-age-wrapper">
      <span class="big-number">40</span>
      <span class="sparkle s1">✨</span>
      <span class="sparkle s2">🔥</span>
      <span class="sparkle s3">🎉</span>
      <span class="sparkle s4">🚀</span>
    </div>

    <div class="title-wrap">
      <span class="sub-badge font-mono">⚡ LEVEL 40 UNLOCKED ⚡</span>
      <h1>Urodzinowy Przewodnik Niespodzianek</h1>
    </div>

    <p class="welcome-text">
      Cześć Misio! Dziś celebrujemy Twoje <strong>40 urodziny</strong>!
      Przygotowałam dla Ciebie specjalną aplikację, która krok po kroku odkryje przed Tobą plan na ten niezapomniany dzień.
    </p>

    <!-- Przycisk Akcji -->
    <button class="btn-start" (click)="goToDashboard()">
      <span class="btn-text">ROZPOCZNIJ PRZYGODĘ</span>
      <span class="btn-icon">🚀</span>
      <div class="btn-shine"></div>
    </button>
  </div>
</div>
