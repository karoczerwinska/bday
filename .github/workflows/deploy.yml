name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --base-href /b-day/

      - name: Prepare Pages artifact
        run: |
          if [ -d dist/b-day/browser ]; then
            echo "PUBLISH_DIR=dist/b-day/browser" >> $GITHUB_ENV
          elif [ -d dist/b-day ]; then
            echo "PUBLISH_DIR=dist/b-day" >> $GITHUB_ENV
          else
            echo "Angular build output not found"
            find dist -maxdepth 3 -type f | head -50
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
